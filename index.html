<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FetchShibu Browser</title>
<!-- Shantell Sans Variable Font -->
<link rel="preconnect" href="https://googleapis.com">
<link rel="preconnect" href="https://gstatic.com" crossorigin>
<link href="https://googleapis.com/css2?family=Shantell+Sans:BNCE,wght@0..100,300..800&display=swap" rel="stylesheet">

<style>
  *:not([class*="icon"]):not([class*="fa-"]):not(.material-icons) {
    font-family: "Shantell Sans", sans-serif !important;
    font-weight: 550 !important;
    font-variation-settings: "BNCE" 50 !important;
  }
</style>

  <style>
    :root {
      font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI",
        Arial, sans-serif;
      color: #222;
      background: #fff;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
    }

    .top-nav {
      position: absolute;
      top: 20px;
      right: 26px;
      display: flex;
      align-items: center;
      gap: 22px;
    }

    .top-nav a {
      color: #555;
      text-decoration: none;
      font-size: 14px;
    }

    .top-nav a:hover { color: #de5833; }

    .menu-button {
      width: 38px;
      height: 38px;
      border: 1px solid #eee;
      border-radius: 50%;
      background: #fff;
      color: #555;
      font-size: 19px;
      cursor: pointer;
    }

    main {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 21vh 20px 50px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 9px;
      margin-bottom: 32px;
      color: #de5833;
      font-size: clamp(34px, 7vw, 46px);
      font-weight: 700;
      letter-spacing: -2px;
    }

    .duck {
      font-size: 0.88em;
      letter-spacing: 0;
    }

    .search-box {
      width: min(100%, 660px);
      min-height: 58px;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 6px 7px 6px 19px;
      border: 1px solid #dedede;
      border-radius: 18px;
      background: #fff;
      box-shadow: 0 3px 14px #0000000c;
      transition: border-color .2s, box-shadow .2s;
    }

    .search-box:focus-within {
      border-color: #bbb;
      box-shadow: 0 5px 20px #00000014;
    }

    .search-icon {
      color: #888;
      font-size: 20px;
    }

    .search-box input {
      flex: 1;
      min-width: 50px;
      height: 42px;
      border: 0;
      outline: 0;
      background: transparent;
      color: #222;
      font: inherit;
      font-size: 16px;
    }

    .search-box input::placeholder { color: #999; }

    .mode-switch {
      display: flex;
      flex-shrink: 0;
      gap: 3px;
      padding: 4px;
      border-radius: 13px;
      background: #f3f3f3;
    }

    .mode-switch button {
      min-height: 36px;
      padding: 0 13px;
      border: 0;
      border-radius: 10px;
      background: transparent;
      color: #555;
      font: inherit;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: background .2s, color .2s, box-shadow .2s;
    }
    .mode-switch button.active {
      background: #fff;
      color: #333;
      box-shadow: 0 1px 4px #00000018;
    }

    .mode-switch button.ai.active {
      color: #bd482b;
    }

    .hint {
      margin-top: 20px;
      color: #888;
      font-size: 13px;
    }

    @media (max-width: 520px) {
      main { padding-top: 19vh; }

      .top-nav {
        top: 14px;
        right: 15px;
        gap: 14px;
      }

      .search-box {
        flex-wrap: wrap;
        padding: 8px 10px;
        border-radius: 16px;
      }

      .search-box input { font-size: 15px; }

      .mode-switch { margin-left: auto; }

      .mode-switch button {
        padding: 0 10px;
        font-size: 12px;
      }
    }
  </style>
</head>

<body>
  <nav class="top-nav" aria-label="Site navigation">
    <a href="https://duckduckgo.com/about">About</a>
    <a href="https://duckduckgo.com/app">App</a>
    <button class="menu-button" aria-label="Menu">☰</button>
  </nav>

  <main>
    <div class="brand">
      <span class="duck" aria-hidden="true">🐕</span>
      <span>Fetch Shibu Browser</span>
    </div>

    <form class="search-box" id="searchForm">
      <span class="search-icon" aria-hidden="true">⌕</span>

      <input
        id="query"
        type="search"
        placeholder="Search the web"
        aria-label="Search or ask a question"
        autocomplete="off"
      >

      <div class="mode-switch" aria-label="Choose search mode">
        <button class="active" type="button" id="searchMode">Search</button>
        <button class="ai" type="button" id="aiMode">✦ Ask AI</button>
      </div>
    </form>

    <p class="hint" id="hint">Private search, less tracking.</p>
  </main>

  <script>
    const form = document.getElementById("searchForm");
    const input = document.getElementById("query");
    const searchMode = document.getElementById("searchMode");
    const aiMode = document.getElementById("aiMode");
    const hint = document.getElementById("hint");

    let mode = "search";

    function setMode(newMode) {
      mode = newMode;
      searchMode.classList.toggle("active", mode === "search");
      aiMode.classList.toggle("active", mode === "ai");
      input.placeholder = mode === "ai"
        ? "Ask anything..."
        : "Search the web";
      hint.textContent = mode === "ai"
        ? "Ask AI in ChatGPT."
        : "Private search, less tracking.";
      input.focus();
    }

    searchMode.addEventListener("click", () => setMode("search"));
    aiMode.addEventListener("click", () => setMode("ai"));

    form.addEventListener("submit", (event) => {
      event.preventDefault();

      const query = input.value.trim();
      if (!query) {
        input.focus();
        return;
      }

      if (mode === "ai") {
        window.location.href =
          "https://chatgpt.com/?q=" + encodeURIComponent(query);
      } else {
        window.location.href =
          "https://duckduckgo.com/?q=" + encodeURIComponent(query);
      } 
  </script>
</body>
</html>
