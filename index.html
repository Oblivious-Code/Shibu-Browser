<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FetchShibu Browser</title>
    <style>
    @font-face {
      font-family: "Shantell Sans";
      src: url("./ShantellSans.ttf") format("truetype");
      font-weight: 300 800;
      font-display: swap;
    }

    :root {

}
  <style>
    :root {
      --bg: #ffffff; --surface: #ffffff; --surface-alt: #f3f3f3;
      --text: #222222; --text-muted: #555555; --text-subtle: #888888;
      --border: #dedede; --border-light: #eeeeee; --shadow: #0000000c;
      --accent: #de5833; --wght: 550;
    }
    :root.dark {
      --bg: #18181b; --surface: #222226; --surface-alt: #2d2d32;
      --text: #f4f4f5; --text-muted: #b4b4bb; --text-subtle: #8a8a93;
      --border: #34343a; --border-light: #2d2d32; --shadow: #00000040;
    }
    * { box-sizing: border-box; font-family: "Shantell Sans", cursive, sans-serif !important; }
    body { margin: 0; min-height: 100vh; background: var(--bg); color: var(--text); font-weight: var(--wght); transition: background .2s, color .2s; }
    button, input { font-weight: var(--wght); font-variation-settings: inherit; }
    .top-nav { position: absolute; top: 20px; right: 26px; display: flex; align-items: center; gap: 22px; }
    .top-nav a { color: var(--text-muted); text-decoration: none; font-size: 14px; }
    .top-nav a:hover { color: var(--accent); }
    .menu-button { width: 38px; height: 38px; border: 1px solid var(--border-light); border-radius: 50%; background: var(--surface); color: var(--text-muted); font-size: 19px; cursor: pointer; }
    .menu-button:hover { border-color: var(--accent); color: var(--accent); }
    main { min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 21vh 20px 50px; }
    .brand { display: flex; align-items: center; gap: 12px; margin-bottom: 32px; color: var(--accent); font-size: clamp(32px, 7vw, 46px); font-weight: 700; letter-spacing: -1px; }
    .logo { display: block; flex-shrink: 0; filter: drop-shadow(0 3px 8px rgba(0,0,0,0.16)); transition: transform .2s; }
    .brand:hover .logo { transform: rotate(-6deg) scale(1.07); }
    .search-box { width: min(100%, 660px); min-height: 58px; display: flex; align-items: center; gap: 10px; padding: 6px 7px 6px 19px; border: 1px solid var(--border); border-radius: 18px; background: var(--surface); box-shadow: 0 3px 14px var(--shadow); }
    .search-box:focus-within { border-color: var(--accent); }
    .search-icon { color: var(--text-subtle); font-size: 20px; }
    .search-box input { flex: 1; min-width: 50px; height: 42px; border: 0; outline: 0; background: transparent; color: var(--text); font-size: 16px; }
    .mode-switch { display: flex; flex-shrink: 0; gap: 3px; padding: 4px; border-radius: 13px; background: var(--surface-alt); }
    .mode-switch button { min-height: 36px; padding: 0 13px; border: 0; border-radius: 10px; background: transparent; color: var(--text-muted); font-size: 13px; cursor: pointer; }
    .mode-switch button.active { background: var(--surface); color: var(--text); box-shadow: 0 1px 4px #00000018; }
    .mode-switch button.ai.active { color: var(--accent); }
    .hint { margin-top: 20px; color: var(--text-subtle); font-size: 13px; }
    .drawer-backdrop { position: fixed; inset: 0; background: rgba(0,0,0,0.3); opacity: 0; pointer-events: none; transition: opacity .25s; z-index: 90; }
    .drawer-backdrop.open { opacity: 1; pointer-events: auto; }
    .settings-drawer { position: fixed; top: 0; right: 0; width: min(320px, 88vw); height: 100vh; background: var(--surface); border-left: 1px solid var(--border-light); box-shadow: -8px 0 28px rgba(0,0,0,0.14); padding: 22px; display: flex; flex-direction: column; gap: 22px; transform: translateX(100%); transition: transform .25s; z-index: 100; }
    .settings-drawer.open { transform: translateX(0); }
    .drawer-header { display: flex; align-items: center; justify-content: space-between; padding-bottom: 12px; border-bottom: 1px solid var(--border-light); }
    .drawer-header h2 { margin: 0; font-size: 18px; color: var(--accent); }
    .close-drawer { width: 32px; height: 32px; border: 1px solid var(--border-light); border-radius: 50%; background: var(--surface-alt); color: var(--text); font-size: 16px; cursor: pointer; }
    .setting-group { display: flex; flex-direction: column; gap: 8px; }
    .setting-row { display: flex; align-items: center; justify-content: space-between; font-size: 14px; }
    .setting-value { color: var(--accent); font-size: 13px; }
    .theme-pills { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; padding: 4px; border-radius: 12px; background: var(--surface-alt); }
    .theme-pills button { padding: 8px; border: 0; border-radius: 9px; background: transparent; color: var(--text-muted); font-size: 13px; cursor: pointer; }
    .theme-pills button.active { background: var(--surface); color: var(--accent); box-shadow: 0 1px 4px rgba(0,0,0,0.12); }
    input[type="range"] { width: 100%; accent-color: var(--accent); cursor: pointer; }
    .reset-btn { margin-top: auto; padding: 10px; border: 1px solid var(--border); border-radius: 12px; background: var(--surface-alt); color: var(--text); font-size: 13px; cursor: pointer; }
    @media (max-width: 520px) {
      main { padding-top: 19vh; }
      .top-nav { top: 14px; right: 15px; gap: 14px; }
      .search-box { flex-wrap: wrap; padding: 8px 10px; border-radius: 16px; }
      .mode-switch { margin-left: auto; }
    }
  </style>
</head>
<body>
  <nav class="top-nav">
    <a href="https://duckduckgo.com">About</a>
    <a href="https://github.io" target="_blank" rel="noopener">Font Maker</a>
    <button class="menu-button" id="menuBtn" aria-label="Open settings">☰</button>
  </nav>

  <div class="drawer-backdrop" id="drawerBackdrop"></div>
  <aside class="settings-drawer" id="settingsDrawer">
    <div class="drawer-header">
      <h2>🐕 FetchShibu Settings</h2>
      <button class="close-drawer" id="closeDrawer">✕</button>
    </div>
    <div class="setting-group">
      <span style="font-size:14px;">Theme</span>
      <div class="theme-pills">
        <button type="button" id="lightBtn" class="active">☀️ Light</button>
        <button type="button" id="darkBtn">🌙 Dark</button>
      </div>
    </div>
    <div class="setting-group">
      <div class="setting-row"><label for="bounceSlider">Font Bounce</label><span class="setting-value" id="bounceVal">50</span></div>
      <input type="range" id="bounceSlider" min="0" max="100" value="50">
    </div>
    <div class="setting-group">
      <div class="setting-row"><label for="weightSlider">Font Weight</label><span class="setting-value" id="weightVal">550</span></div>
      <input type="range" id="weightSlider" min="300" max="800" step="10" value="550">
    </div>
    <button class="reset-btn" type="button" id="resetSettings">Reset to Defaults</button>
  </aside>

  <main>
    <div class="brand">
      <svg class="logo" viewBox="0 0 68 68" width="48" height="48" aria-hidden="true">
        <circle cx="34" cy="34" r="31" fill="#ffffff" stroke="#de5833" stroke-width="1.5"/>
        <circle cx="34" cy="34" r="28" fill="#de5833"/>
        <circle cx="34" cy="34" r="25" fill="none" stroke="#ff825c" stroke-width="1" opacity="0.45"/>
        <polygon points="15,31 19,11 31,24" fill="#f09336"/>
        <polygon points="53,31 49,11 37,24" fill="#f09336"/>
        <polygon points="18.5,28 20.5,16 27.5,24" fill="#ffe6c7"/>
        <polygon points="49.5,28 47.5,16 40.5,24" fill="#ffe6c7"/>
        <path d="M16,35 C16,24 24,20 34,20 C44,20 52,24 52,35 C52,46 44,53 34,53 C24,53 16,46 16,35 Z" fill="#f09336"/>
        <path d="M16.2,36 C16.2,45.8 24,52.8 34,52.8 C44,52.8 51.8,45.8 51.8,36 C46,35.5 41.2,39 34,39 C26.8,39 22,35.5 16.2,36 Z" fill="#fff8ef"/>
        <path d="M22,27.5 L27.5,29" stroke="#fff8ef" stroke-width="2.2" stroke-linecap="round"/>
        <path d="M46,27.5 L40.5,29" stroke="#fff8ef" stroke-width="2.2" stroke-linecap="round"/>
        <circle cx="25.5" cy="32.5" r="2.6" fill="#222"/>
        <circle cx="42.5" cy="32.5" r="2.6" fill="#222"/>
        <circle cx="24.7" cy="31.7" r="0.9" fill="#fff"/>
        <circle cx="41.7" cy="31.7" r="0.9" fill="#fff"/>
        <ellipse cx="34" cy="39.5" rx="3.2" ry="2.2" fill="#222"/>
        <path d="M30.5,43.5 Q34,46.2 37.5,43.5" fill="none" stroke="#222" stroke-width="2" stroke-linecap="round"/>
        <polygon points="34,54 27,50.5 27,57.5" fill="#2b9eb3" stroke="#ffffff" stroke-width="1.2" stroke-linejoin="round"/>
        <polygon points="34,54 41,50.5 41,57.5" fill="#2b9eb3" stroke="#ffffff" stroke-width="1.2" stroke-linejoin="round"/>
        <circle cx="34" cy="54" r="2" fill="#1f7a8c" stroke="#ffffff" stroke-width="1"/>
      </svg>
      <span>Fetch Shibu Browser</span>
    </div>

    <form class="search-box" id="searchForm">
      <span class="search-icon" aria-hidden="true">⌕</span>
      <input id="query" type="search" placeholder="Search the web" autocomplete="off">
      <div class="mode-switch">
        <button class="active" type="button" id="searchMode">Search</button>
        <button class="ai" type="button" id="aiMode">✦ Ask AI</button>
      </div>
    </form>
    <p class="hint" id="hint">Private search, less tracking.</p>
  </main>

  <script>
    const form = document.getElementById("searchForm");
    const input = document.getElementById("query");
    const searchMode = document.getElementById("searchMode");
    const aiMode = document.getElementById("aiMode");
    const hint = document.getElementById("hint");
    const menuBtn = document.getElementById("menuBtn");
    const closeDrawer = document.getElementById("closeDrawer");
    const drawerBackdrop = document.getElementById("drawerBackdrop");
    const settingsDrawer = document.getElementById("settingsDrawer");
    const lightBtn = document.getElementById("lightBtn");
    const darkBtn = document.getElementById("darkBtn");
    const bounceSlider = document.getElementById("bounceSlider");
    const bounceVal = document.getElementById("bounceVal");
    const weightSlider = document.getElementById("weightSlider");
    const weightVal = document.getElementById("weightVal");
    const resetSettings = document.getElementById("resetSettings");
    const root = document.documentElement;

    menuBtn.onclick = () => { settingsDrawer.classList.add("open"); drawerBackdrop.classList.add("open"); };
    const hideDrawer = () => { settingsDrawer.classList.remove("open"); drawerBackdrop.classList.remove("open"); };
    closeDrawer.onclick = hideDrawer;
    drawerBackdrop.onclick = hideDrawer;

    function applySettings(isDark, bounce, weight) {
      root.classList.toggle("dark", isDark);
      lightBtn.classList.toggle("active", !isDark);
      darkBtn.classList.toggle("active", isDark);
      document.body.style.fontVariationSettings = `"BNCE" ${bounce}`;
      bounceSlider.value = bounce; bounceVal.textContent = bounce;
      root.style.setProperty("--wght", weight);
      weightSlider.value = weight; weightVal.textContent = weight;
    }

    function saveSettings() {
      localStorage.setItem("fetchshibu_settings", JSON.stringify({
        dark: root.classList.contains("dark"), bounce: bounceSlider.value, weight: weightSlider.value
      }));
    }

    const saved = JSON.parse(localStorage.getItem("fetchshibu_settings") || "null");
    applySettings(saved ? saved.dark : false, saved ? saved.bounce : 50, saved ? saved.weight : 550);

    lightBtn.onclick = () => { applySettings(false, bounceSlider.value, weightSlider.value); saveSettings(); };
    darkBtn.onclick = () => { applySettings(true, bounceSlider.value, weightSlider.value); saveSettings(); };
    bounceSlider.oninput = () => { applySettings(root.classList.contains("dark"), bounceSlider.value, weightSlider.value); saveSettings(); };
    weightSlider.oninput = () => { applySettings(root.classList.contains("dark"), bounceSlider.value, weightSlider.value); saveSettings(); };
    resetSettings.onclick = () => { applySettings(false, 50, 550); localStorage.removeItem("fetchshibu_settings"); };

    let mode = "search";
    function setMode(m) {
      mode = m;
      searchMode.classList.toggle("active", m === "search");
      aiMode.classList.toggle("active", m === "ai");
      input.placeholder = m === "ai" ? "Ask anything..." : "Search the web";
      hint.textContent = m === "ai" ? "Ask AI in ChatGPT." : "Private search, less tracking.";
      input.focus();
    }
    searchMode.onclick = () => setMode("search");
    aiMode.onclick = () => setMode("ai");

    form.onsubmit = (e) => {
      e.preventDefault();
      const q = input.value.trim();
      if (!q) return input.focus();
      window.location.href = (mode === "ai" ? "https://chatgpt.com" : "https://duckduckgo.com") + encodeURIComponent(q);
    };
  </script>
</body>
</html>
