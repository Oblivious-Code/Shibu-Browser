<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FetchShibu Browser</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Shantell+Sans:BNCE,wght@0..100,300..800&display=swap" rel="stylesheet">

  <style>
    :root {
      font-family: "Shantell Sans", Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-weight: 550;
      font-variation-settings: "BNCE" 50;
      color: #222;
      background: #fff;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
    }

    body, button, input, textarea, select {
      font-family: inherit;
      font-weight: inherit;
      font-variation-settings: inherit;
    }

    .top-nav {
      position: absolute;
      top: 20px;
      right: 26px;
      display: flex;
      align-items: center;
      gap: 22px;
    }

    .top-nav a {
      color: #555;
      text-decoration: none;
      font-size: 14px;
    }

    .top-nav a:hover { color: #de5833; }

    .menu-button {
      width: 38px;
      height: 38px;
      border: 1px solid #eee;
      border-radius: 50%;
      background: #fff;
      color: #555;
      font-size: 19px;
      cursor: pointer;
    }

    main {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 21vh 20px 50px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 9px;
      margin-bottom: 32px;
      color: #de5833;
      font-size: clamp(34px, 7vw, 46px);
      font-weight: 700;
      letter-spacing: -1px;
    }

    .duck {
      font-size: 0.88em;
      letter-spacing: 0;
    }

    .search-box {
      width: min(100%, 660px);
      min-height: 58px;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 6px 7px 6px 19px;
      border: 1px solid #dedede;
      border-radius: 18px;
      background: #fff;
      box-shadow: 0 3px 14px #0000000c;
      transition: border-color .2s, box-shadow .2s;
    }

    .search-box:focus-within {
      border-color: #bbb;
      box-shadow: 0 5px 20px #00000014;
    }

    .search-icon {
      color: #888;
      font-size: 20px;
    }

    .search-box input {
      flex: 1;
      min-width: 50px;
      height: 42px;
      border: 0;
      outline: 0;
      background: transparent;
      color: #222;
      font-family: inherit;
      font-size: 16px;
    }

    .search-box input::placeholder { color: #999; }

    .mode-switch {
      display: flex;
      flex-shrink: 0;
      gap: 3px;
      padding: 4px;
      border-radius: 13px;
      background: #f3f3f3;
    }

    .mode-switch button {
      min-height: 36px;
      padding: 0 13px;
      border: 0;
      border-radius: 10px;
      background: transparent;
      color: #555;
      font-family: inherit;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: background .2s, color .2s, box-shadow .2s;
    }

    .mode-switch button.active {
      background: #fff;
      color: #333;
      box-shadow: 0 1px 4px #00000018;
    }

    .mode-switch button.ai.active {
      color: #bd482b;
    }

    .hint {
      margin-top: 20px;
      color: #888;
      font-size: 13px;
    }

    @media (max-width: 520px) {
      main { padding-top: 19vh; }

      .top-nav {
        top: 14px;
        right: 15px;
        gap: 14px;
      }

      .search-box {
        flex-wrap: wrap;
        padding: 8px 10px;
        border-radius: 16px;
      }

      .search-box input { font-size: 15px; }

      .mode-switch { margin-left: auto; }

      .mode-switch button {
        padding: 0 10px;
        font-size: 12px;
      }
    }
  </style>
</head>

<body>
  <nav class="top-nav" aria-label="Site navigation">
    <a href="https://duckduckgo.com/about">About</a>
    <a href="https://duckduckgo.com/app">App</a>
    <button class="menu-button" aria-label="Menu">☰</button>
  </nav>

  <main>
    <div class="brand">
      <span class="svg" aria-hidden="true"><svg class="logo" viewBox="0 0 68 68" width="48" height="48" aria-hidden="true">
  <!-- White sticker outline on outer badge only -->
  <circle cx="34" cy="34" r="31" fill="#ffffff" stroke="#de5833" stroke-width="1.5"/>
  <!-- Outer badge -->
  <circle cx="34" cy="34" r="28" fill="#de5833"/>
  <!-- Subtle inner ring -->
  <circle cx="34" cy="34" r="25" fill="none" stroke="#ff825c" stroke-width="1" opacity="0.45"/>

  <!-- Smooth Shiba ears (no white outline) -->
  <polygon points="15,31 19,11 31,24" fill="#f09336"/>
  <polygon points="53,31 49,11 37,24" fill="#f09336"/>
  <!-- Inner ear triangles -->
  <polygon points="18.5,28 20.5,16 27.5,24" fill="#ffe6c7"/>
  <polygon points="49.5,28 47.5,16 40.5,24" fill="#ffe6c7"/>

  <!-- Smooth Shiba head (no white outline) -->
  <path d="M16,35 C16,24 24,20 34,20 C44,20 52,24 52,35 C52,46 44,53 34,53 C24,53 16,46 16,35 Z" fill="#f09336"/>

  <!-- Cream cheeks & muzzle -->
  <path d="M16.2,36 C16.2,45.8 24,52.8 34,52.8 C44,52.8 51.8,45.8 51.8,36 C46,35.5 41.2,39 34,39 C26.8,39 22,35.5 16.2,36 Z" fill="#fff8ef"/>

  <!-- Confident eyebrows -->
  <path d="M22,27.5 L27.5,29" stroke="#fff8ef" stroke-width="2.2" stroke-linecap="round"/>
  <path d="M46,27.5 L40.5,29" stroke="#fff8ef" stroke-width="2.2" stroke-linecap="round"/>

  <!-- Eyes with shine -->
  <circle cx="25.5" cy="32.5" r="2.6" fill="#222"/>
  <circle cx="42.5" cy="32.5" r="2.6" fill="#222"/>
  <circle cx="24.7" cy="31.7" r="0.9" fill="#fff"/>
  <circle cx="41.7" cy="31.7" r="0.9" fill="#fff"/>

  <!-- Nose & smirk -->
  <ellipse cx="34" cy="39.5" rx="3.2" ry="2.2" fill="#222"/>
  <path d="M30.5,43.5 Q34,46.2 37.5,43.5" fill="none" stroke="#222" stroke-width="2" stroke-linecap="round"/>

  <!-- Teal bowtie -->
  <polygon points="34,54 27,50.5 27,57.5" fill="#2b9eb3" stroke="#ffffff" stroke-width="1.2" stroke-linejoin="round"/>
  <polygon points="34,54 41,50.5 41,57.5" fill="#2b9eb3" stroke="#ffffff" stroke-width="1.2" stroke-linejoin="round"/>
  <circle cx="34" cy="54" r="2" fill="#1f7a8c" stroke="#ffffff" stroke-width="1"/>
</svg>
</span>
      <span>Fetch Shibu Browser</span>
    </div>

    <form class="search-box" id="searchForm">
      <span class="search-icon" aria-hidden="true">⌕</span>

      <input
        id="query"
        type="search"
        placeholder="Search the web"
        aria-label="Search or ask a question"
        autocomplete="off"
      >

      <div class="mode-switch" aria-label="Choose search mode">
        <button class="active" type="button" id="searchMode">Search</button>
        <button class="ai" type="button" id="aiMode">✦ Ask AI</button>
      </div>
    </form>

    <p class="hint" id="hint">Private search, less tracking.</p>
  </main>

  <script>
    const form = document.getElementById("searchForm");
    const input = document.getElementById("query");
    const searchMode = document.getElementById("searchMode");
    const aiMode = document.getElementById("aiMode");
    const hint = document.getElementById("hint");

    let mode = "search";

    function setMode(newMode) {
      mode = newMode;
      searchMode.classList.toggle("active", mode === "search");
      aiMode.classList.toggle("active", mode === "ai");
      input.placeholder = mode === "ai"
        ? "Ask anything..."
        : "Search the web";
      hint.textContent = mode === "ai"
        ? "Ask AI in ChatGPT."
        : "Private search, less tracking.";
      input.focus();
    }

    searchMode.addEventListener("click", () => setMode("search"));
    aiMode.addEventListener("click", () => setMode("ai"));

    form.addEventListener("submit", (event) => {
      event.preventDefault();

      const query = input.value.trim();
      if (!query) {
        input.focus();
        return;
      }

      if (mode === "ai") {
        window.location.href =
          "https://chatgpt.com/?q=" + encodeURIComponent(query);
      } else {
        window.location.href =
          "https://duckduckgo.com/?q=" + encodeURIComponent(query);
      }
    });
  </script>
</body>
</html>
