<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DuckDuckGo — Search</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      color: #333;
      background: #fff;
    }

    /* Chrome-style frame */
    .tabs {
      height: 40px;
      display: flex;
      align-items: end;
      gap: 8px;
      padding: 5px 10px 0;
      background: #dee1e6;
    }

    .tab {
      width: 230px;
      height: 35px;
      display: flex;
      align-items: center;
      gap: 9px;
      padding: 0 13px;
      border-radius: 10px 10px 0 0;
      background: #fff;
      color: #444;
      font-size: 13px;
    }

    .tab-mark {
      width: 15px;
      height: 15px;
      border-radius: 50%;
      background: #de5833;
    }

    .tab-close { margin-left: auto; }

    .toolbar {
      height: 52px;
      display: flex;
      align-items: center;
      gap: 13px;
      padding: 0 16px;
      background: #fff;
    }

    .nav {
      display: flex;
      gap: 15px;
      color: #5f6368;
      font-size: 21px;
    }

    .address {
      height: 35px;
      flex: 1;
      display: flex;
      align-items: center;
      gap: 9px;
      padding: 0 14px;
      border-radius: 20px;
      background: #f1f3f4;
      color: #5f6368;
      font-size: 13px;
    }

    .address input {
      width: 100%;
      border: 0;
      outline: 0;
      background: transparent;
      font: inherit;
      color: inherit;
    }

    .browser-menu {
      color: #5f6368;
      font-size: 21px;
    }

    /* DuckDuckGo-inspired homepage */
    main {
      min-height: calc(100vh - 92px);
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 19vh 20px 40px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 7px;
      margin-bottom: 25px;
      color: #de5833;
      font-size: 42px;
      font-weight: 700;
      letter-spacing: -1.8px;
    }

    .duck {
      font-size: 39px;
      line-height: 1;
      letter-spacing: 0;
    }

    .search {
      width: min(100%, 630px);
      height: 52px;
      display: flex;
      align-items: center;
      padding: 5px 6px 5px 18px;
      border: 1px solid #c9c9c9;
      border-radius: 28px;
      box-shadow: 0 1px 3px #00000012;
    }

    .search:focus-within {
      border-color: #999;
      box-shadow: 0 2px 6px #00000020;
    }

    .search input {
      flex: 1;
      min-width: 0;
      border: 0;
      outline: 0;
      background: transparent;
      color: #333;
      font-size: 16px;
    }

    .search button {
      width: 40px;
      height: 40px;
      border: 0;
      border-radius: 50%;
      background: #de5833;
      color: white;
      font-size: 20px;
      cursor: pointer;
    }

    .tagline {
      margin-top: 22px;
      color: #666;
      font-size: 14px;
    }

    .tagline span { color: #de5833; }

    @media (max-width: 500px) {
      main { padding-top: 16vh; }
      .brand { font-size: 36px; }
      .duck { font-size: 34px; }
      .tab { width: 185px; }
    }
  </style>
</head>

<body>
  <div class="tabs">
    <div class="tab">
      <span class="tab-mark"></span>
      <span>New Tab</span>
      <span class="tab-close">×</span>
    </div>
    <span style="font-size:20px;color:#555">+</span>
  </div>

  <div class="toolbar">
    <div class="nav">
      <span title="Back">‹</span>
      <span title="Forward">›</span>
      <span title="Reload">⟳</span>
    </div>

    <div class="address">
      <span>🔒</span>
      <input value="duckduckgo.com" aria-label="Address bar">
      <span>☆</span>
    </div>

    <span class="browser-menu">⋮</span>
  </div>

  <main>
    <div class="brand">
      <span class="duck">🦆</span>
      <span>DuckDuckGo</span>
    </div>

    <form class="search" id="searchForm">
      <input
        id="query"
        type="search"
        placeholder="Search the web without being tracked"
        aria-label="Search the web"
        autofocus
      >
      <button type="submit" aria-label="Search">⌕</button>
    </form>

    <div class="tagline"><span>🛡</span> Search privately</div>
  </main>

  <script>
    document.getElementById("searchForm").addEventListener("submit", function (event) {
      event.preventDefault();

      const query = document.getElementById("query").value.trim();
      if (query) {
        window.location.href =
          "https://duckduckgo.com/?q=" + encodeURIComponent(query);
      }
    });
  </script>
</body>
</html>
