<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DuckDuckGo Search</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: #fff;
      color: #333;
      font-family: Arial, Helvetica, sans-serif;
    }

    .top-links {
      position: absolute;
      top: 18px;
      right: 24px;
      display: flex;
      align-items: center;
      gap: 20px;
      font-size: 14px;
    }

    .top-links a {
      color: #555;
      text-decoration: none;
    }

    .top-links a:hover {
      text-decoration: underline;
    }

    .menu-button {
      border: 0;
      background: transparent;
      color: #666;
      font-size: 22px;
      cursor: pointer;
    }

    main {
      width: 100%;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 21vh 20px 50px;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 7px;
      margin-bottom: 25px;
      color: #de5833;
      font-size: 42px;
      font-weight: 700;
      letter-spacing: -1.8px;
    }

    .duck {
      font-size: 39px;
      line-height: 1;
      letter-spacing: 0;
    }

    .search-form {
      width: min(100%, 630px);
      height: 52px;
      display: flex;
      align-items: center;
      padding: 5px 6px 5px 18px;
      border: 1px solid #c9c9c9;
      border-radius: 28px;
      box-shadow: 0 1px 3px #00000012;
    }

    .search-form:focus-within {
      border-color: #999;
      box-shadow: 0 2px 7px #00000020;
    }

    .search-form input {
      flex: 1;
      min-width: 0;
      height: 100%;
      border: 0;
      outline: 0;
      background: transparent;
      color: #333;
      font-size: 16px;
    }

    .search-form button {
      width: 40px;
      height: 40px;
      border: 0;
      border-radius: 50%;
      background: #de5833;
      color: #fff;
      font-size: 21px;
      cursor: pointer;
    }

    .privacy-message {
      margin-top: 22px;
      color: #666;
      font-size: 14px;
    }

    .privacy-icon {
      color: #de5833;
    }

    @media (max-width: 500px) {
      main {
        padding-top: 20vh;
      }

      .logo {
        font-size: 36px;
      }

      .duck {
        font-size: 34px;
      }

      .top-links {
        top: 14px;
        right: 15px;
      }
    }
  </style>
</head>

<body>
  <nav class="top-links" aria-label="Site navigation">
    <a href="https://duckduckgo.com/about">About</a>
    <a href="https://duckduckgo.com/app">App</a>
    <button class="menu-button" aria-label="Menu">☰</button>
  </nav>

  <main>
    <div class="logo" aria-label="DuckDuckGo">
      <span class="duck" aria-hidden="true">🦆</span>
      <span>DuckDuckGo</span>
    </div>

    <form class="search-form" id="searchForm" role="search">
      <input
        id="query"
        type="search"
        placeholder="Search the web without being tracked"
        aria-label="Search the web"
        autocomplete="off"
      >
      <button type="submit" aria-label="Search">⌕</button>
    </form>

    <div class="privacy-message">
      <span class="privacy-icon">●</span> Search privately
    </div>
  </main>

  <script>
    document
      .getElementById("searchForm")
      .addEventListener("submit", function (event) {
        event.preventDefault();

        const query = document.getElementById("query").value.trim();

        if (query) {
          window.location.href =
            "https://duckduckgo.com/?q=" + encodeURIComponent(query);
        }
      });
  </script>
</body>
</html>
